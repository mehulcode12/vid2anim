[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2anim"
version = "0.1.0"
description = "Animate any 3D character model from video or photos using AI motion capture and universal retargeting."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mehul", email = "mehul@users.noreply.github.com"},
    {name = "vid2anim contributors"}
]
keywords = [
    "motion-capture",
    "retargeting",
    "animation",
    "3d",
    "mixamo",
    "vrm",
    "gltf",
    "glb",
    "blender",
    "computer-vision",
    "deep-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "opencv-python>=4.7.0",
    "mediapipe>=0.10.0; python_version < '3.13'",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
full = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "trimesh>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/mehulcode12/vid2anim"
Documentation = "https://github.com/mehulcode12/vid2anim#readme"
Repository = "https://github.com/mehulcode12/vid2anim.git"
"Bug Tracker" = "https://github.com/mehulcode12/vid2anim/issues"

[project.scripts]
vid2anim = "vid2anim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vid2anim*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

