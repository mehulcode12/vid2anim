name: Release & Package Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-release:
    name: Build Distribution & Blender Add-on
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build Python wheel and sdist
        run: |
          python -m build

      - name: Package Blender Add-on Zip
        run: |
          mkdir -p dist/blender/vid2anim_blender
          cp plugins/blender/vid2anim_blender.py dist/blender/vid2anim_blender/vid2anim_blender.py
          cp plugins/blender/vid2anim_blender.py dist/blender/vid2anim_blender/__init__.py
          cd dist/blender && zip -r ../vid2anim_blender.zip vid2anim_blender && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/vid2anim_blender.zip
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish Python Package to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish NPM Package
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public || echo "NPM publish skipped or already published"
